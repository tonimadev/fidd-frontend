name: Frontend CI/CD Pipeline
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: npm run build
      - name: Prepare Standalone Build
        run: |
          # Copy public and static assets to standalone folder as per Next.js documentation
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          
          # Create tarball artifact
          cd .next/standalone
          tar -czf ../../fidd-frontend.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: fidd-frontend-tar
          path: fidd-frontend.tar.gz
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fidd-frontend-tar
          path: ./artifacts

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.VM_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Artifact
        env:
          SSH_HOST: ${{ secrets.VM_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Cleaning up old artifact on remote VM..."
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "rm -rf ~/fidd-frontend-new.tar.gz"
          
          echo "Uploading tarball to VM..."
          scp -o StrictHostKeyChecking=no ./artifacts/fidd-frontend.tar.gz ${SSH_USER}@${SSH_HOST}:~/fidd-frontend-new.tar.gz

      - name: Deploy Frontend
        env:
          SSH_HOST: ${{ secrets.VM_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_DIR: ${{ secrets.FRONTEND_DIR || 'fidd-frontend' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash -s -- "$FRONTEND_DIR" "$NEXT_PUBLIC_API_URL" "$STRIPE_SECRET_KEY" "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" "$NEXT_PUBLIC_GOOGLE_CLIENT_ID" "$NEXT_PUBLIC_FIREBASE_API_KEY" "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" "$NEXT_PUBLIC_FIREBASE_APP_ID" "$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID" << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          FRONTEND_DIR="$1"
          API_URL="$2"
          STRIPE_KEY="$3"
          GOOGLE_MAPS_KEY="$4"
          GOOGLE_CLIENT_ID="$5"
          FIREBASE_API_KEY="$6"
          FIREBASE_AUTH_DOMAIN="$7"
          FIREBASE_PROJECT_ID="$8"
          FIREBASE_STORAGE_BUCKET="$9"
          FIREBASE_MESSAGING_ID="${10}"
          FIREBASE_APP_ID="${11}"
          FIREBASE_MEASUREMENT_ID="${12}"
          
          # Garante que o diretório de trabalho seja relativo ao home se não for absoluto
          if [[ "$FRONTEND_DIR" != /* ]]; then
            WORK_DIR="${HOME}/${FRONTEND_DIR}"
          else
            WORK_DIR="${FRONTEND_DIR}"
          fi

          TAR_PATH="${HOME}/fidd-frontend-new.tar.gz"

          # Diagnóstico básico
          echo "Checking Node.js version..."
          node -v || echo "Node.js not found in PATH"

          echo "Creating frontend directory..."
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"

          echo "Stopping old frontend..."
          # Tenta matar pelo PID gravado
          if [ -f app.pid ]; then
            PID=$(cat app.pid)
            if kill -0 "$PID" 2>/dev/null; then
              echo "Killing process $PID..."
              kill -15 "$PID" || kill -9 "$PID"
              sleep 2
            fi
            rm -f app.pid
          fi
          # Garante que a porta 3000 está livre (caso o PID tenha sido perdido)
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp || true
          elif command -v lsof >/dev/null 2>&1; then
            lsof -t -i:3000 | xargs kill -9 2>/dev/null || true
          fi

          echo "Extracting new deployment..."
          # Clean up old files (except logs and pid) before extracting
          find . -maxdepth 1 ! -name 'app.log' ! -name 'app.pid' ! -name '.' -exec rm -rf {} +
          tar -xzf "$TAR_PATH" -C .
          
          echo "Starting frontend..."
          # Injected environment variables for Next.js standalone
          export PORT=3000
          export HOSTNAME=0.0.0.0
          export NEXT_PUBLIC_API_URL="${API_URL}"
          export STRIPE_SECRET_KEY="${STRIPE_KEY}"
          export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_KEY}"
          export NEXT_PUBLIC_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
          export NEXT_PUBLIC_FIREBASE_API_KEY="${FIREBASE_API_KEY}"
          export NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${FIREBASE_AUTH_DOMAIN}"
          export NEXT_PUBLIC_FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}"
          export NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET}"
          export NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_ID}"
          export NEXT_PUBLIC_FIREBASE_APP_ID="${FIREBASE_APP_ID}"
          export NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="${FIREBASE_MEASUREMENT_ID}"

          echo "Executing: nohup node server.js > app.log 2>&1 &"
          # Inicia com nohup, desvia output para log e usa disown para desvincular do shell
          nohup node server.js > app.log 2>&1 &
          APP_PID=$!
          disown $APP_PID 2>/dev/null || true
          echo $APP_PID > app.pid
          echo "Frontend started with PID: $APP_PID on port 3000"

          echo "Waiting for frontend to start..."
          sleep 5

          echo "Running health check..."
          HEALTHY=false
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "SUCCESS: Frontend is healthy."
              HEALTHY=true
              break
            fi
            echo "Attempt $i/20 - waiting..."
            sleep 2
          done
          
          if [ "$HEALTHY" = false ]; then
            echo "ERROR: Health check failed. Last 50 lines of app.log:"
            tail -n 50 app.log
            exit 1
          fi
          SCRIPT

      - name: Verify Deployment
        env:
          SSH_HOST: ${{ secrets.VM_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_DIR: ${{ secrets.FRONTEND_DIR || 'fidd-frontend' }}
        run: |
          echo "Verifying deployment..."
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "
            if [[ '$FRONTEND_DIR' != /* ]]; then
              WORK_DIR='${HOME}/${FRONTEND_DIR}'
            else
              WORK_DIR='${FRONTEND_DIR}'
            fi
            
            echo 'Checking if process exists on port 3000...'
            ss -tulpn | grep :3000 || netstat -tulpn | grep :3000 || echo 'No process found on port 3000'
            
            echo 'Checking Node processes...'
            ps aux | grep node | grep server.js || echo 'No node server.js process found'
            
            echo 'Checking health via curl...'
            curl -I http://127.0.0.1:3000 || { echo 'ERROR: Application not responding on port 3000. Last logs:'; tail -n 20 \$WORK_DIR/app.log; exit 1; }
          "
